# Performance headers. Apply these in the real server block; this file is an
# example and is not loaded automatically by the application.
gzip on;
gzip_vary on;
gzip_min_length 1024;
gzip_comp_level 6;
gzip_types
  text/css
  application/javascript
  application/json
  application/xml
  image/svg+xml
  font/woff2;

location ~* ^/dist/assets/.+\.[a-z0-9]+$ {
  expires 1y;
  add_header Cache-Control "public, max-age=31536000, immutable" always;
  access_log off;
}

location ~* \.(?:css|js|woff2)$ {
  expires 1y;
  add_header Cache-Control "public, max-age=31536000, immutable" always;
  access_log off;
}

location ~* \.(?:avif|webp|png|jpe?g|gif|svg|ico)$ {
  expires 30d;
  add_header Cache-Control "public, max-age=2592000, stale-while-revalidate=86400" always;
  access_log off;
}

add_header X-Content-Type-Options "nosniff" always;

location / {
  try_files $uri $uri/ /index.php?$query_string;
}

# Protect sensitive directories
location ~ ^/(controllers|vendor|pages|includes)/ {
  deny all;
  return 403;
}

# Protect sensitive files
location ~ ^/(config\.php|composer\.(json|lock)|\.gitignore|README\.md)$ {
  deny all;
  return 403;
}
